services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synccinema_backend
    restart: unless-stopped
    environment:
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173}
      - SITE_PASSWORD=${SITE_PASSWORD:?Set SITE_PASSWORD in the project .env file before deployment}
      - CLOUDFLARE_TURN_TOKEN=${CLOUDFLARE_TURN_TOKEN:-}
      - CLOUDFLARE_TURN_KEY_ID=${CLOUDFLARE_TURN_KEY_ID:-}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Nginx üzerinden proxy yaptığımız için Socket.io direkt aynı adrese (/) bağlanacak.
        - VITE_SOCKET_URL=/
    container_name: synccinema_frontend
    restart: unless-stopped
    ports:
      - "8050:80"
    depends_on:
      - backend
